name: Build Bulk 16 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest Bulk 16 project
        run: |
          rm -rf app src gradle
          unzip -q Bulk16Android_phone_build_fixed.zip
          cp -r b16ready/app .
          cp b16ready/build.gradle .
          cp b16ready/settings.gradle .
          cp b16ready/gradle.properties .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bulk16-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
